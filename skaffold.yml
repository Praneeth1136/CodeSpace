apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}
    
  artifacts:
  
  - image: ai-orchestration
    context: ai-orchestration
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"
  - image: auth
    context: auth
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"
  
  - image: notification
    context: notifications
    docker:
      dockerfile: dockerfile
    sync:
      infer:
        - "src/**"

  - image: agent
    context: sandbox/agent
    docker:
      dockerfile: dockerfile

  - image: router
    context: sandbox/routers
    docker:
      dockerfile: dockerfile

  - image: sandbox
    context: sandbox/server
    docker:
      dockerfile: dockerfile

  - image: template
    context: sandbox/templates
    docker:
      dockerfile: dockerfile

manifests:
  rawYaml:
    - k8s/ai-deployment.yml
    - k8s/ai.service.yml
    - k8s/auth-deployment.yml
    - k8s/auth.service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox.service.yml
    - k8s/ingress.yml
    - k8s/router-deployment.yml
    - k8s/router.service.yml
    - k8s/rbac-sa.yml
    - k8s/rbac-role.yml
    - k8s/rbac-rb.yml
    - k8s/secret.yml
    - k8s/notifications.service.yml
    - k8s/notifications-deployment.yml
    

# Add this at the bottom of your skaffold.yml
portForward:
  - resourceType: service
    resourceName: sandbox-service
    port: 80
    localPort: 3000
